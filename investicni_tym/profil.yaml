# Tvůj investiční profil – upravuj podle sebe.
# Tým agentů z něj vychází při každém doporučení.

investor:
  mena: CZK
  kapital_celkem: 2500000          # celý budget k obchodování
  rezerva_hotovost: 0              # žádná vyčleněná rezerva
  broker: XTB                      # doporučovat jen instrumenty dostupné u XTB
  tolerance_rizika: vysoka         # nizka | stredni | vysoka
  horizont_let: 5
  zkusenosti: pokrocily            # zacatecnik | pokrocily | profesional
  cile:
    - Maximální zhodnocení, investor přijímá vysoké riziko a velké výkyvy
    - Aktivní obchodování celého kapitálu přes XTB
  obchodovatelne_u_brokera:
    - Akcie a ETF (reálné, bez páky)
    - CFD na akcie, ETF, indexy, forex, komodity a krypto (s pákou dle limitů ESMA)
  omezeni:
    - Páka jen v limitech XTB/ESMA pro retail (forex 1:30, indexy 1:20, komodity 1:10, akcie 1:5, krypto 1:2)
    - Každý obchod musí mít stop-loss

# Rozdělení kapitálu mezi strategie (v %)
alokace_cil:
  dlouhodobe: 30
  kratkodobe_swing: 35
  trading: 35

# Co aktuálně držíš (ticker podle Yahoo Finance, počet kusů, nákupní cena)
# Zatím prázdné – tým navrhne, jak kapitál postupně nasadit.
portfolio: []

# Co má tým sledovat (vše je obchodovatelné u XTB)
watchlist:
  - ^GSPC      # S&P 500 (CFD US500)
  - ^IXIC      # Nasdaq (CFD US100)
  - ^GDAXI     # DAX (CFD DE40)
  - NVDA
  - MSFT
  - TSLA
  - AMD
  - META
  - CEZ.PR     # ČEZ
  - BTC-USD
  - ETH-USD
  - GC=F       # zlato
  - CL=F       # ropa WTI
  - EURUSD=X
  - EURCZK=X
